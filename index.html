<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevStory Daily</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  /* ===== LIGHT (default) ===== */
  :root {
    --bg: #F9F8F4; --fg: #2D3A31; --sage: #8C9A84; --clay: #DCCFC2;
    --clay-light: #F2F0EB; --stone: #E6E2DA; --terracotta: #C27B66;
    --card-bg: #FFFFFF; --shadow-xl: 0 25px 50px -12px rgba(45,58,49,0.15);
    --grain-opacity: 0.015;
    --serif: 'Playfair Display', Georgia, serif;
    --sans: 'Source Sans 3', 'Segoe UI', sans-serif;
    --radius-card: 24px; --radius-pill: 9999px;
  }
  /* ===== DARK ===== */
  html.dark {
    --bg: #1a1f1c; --fg: #dce4de; --sage: #9aaa92; --clay: #4a4640;
    --clay-light: #242a26; --stone: #333b35; --terracotta: #d4896f;
    --card-bg: #222822; --shadow-xl: 0 25px 50px -12px rgba(0,0,0,0.4);
    --grain-opacity: 0.03;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--sans); background: var(--bg); color: var(--fg);
    line-height: 1.7; font-weight: 400; font-size: 16px;
    -webkit-font-smoothing: antialiased; transition: background 0.4s ease, color 0.4s ease;
  }
  .grain-overlay {
    pointer-events: none; position: fixed; inset: 0; z-index: 9999;
    opacity: var(--grain-opacity);
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    background-repeat: repeat; transition: opacity 0.4s ease;
  }
  .container { max-width: 720px; margin: 0 auto; padding: 0 1.5rem; }
  .fade-in {
    opacity: 0; transform: translateY(16px);
    transition: opacity 0.7s ease-out, transform 0.7s ease-out;
  }
  .fade-in.visible { opacity: 1; transform: translateY(0); }

  /* ===== TOOLBAR ===== */
  .toolbar {
    position: sticky; top: 0; z-index: 100; background: var(--bg);
    border-bottom: 1px solid var(--stone); padding: 0.6rem 0;
    transition: background 0.4s ease, border-color 0.4s ease;
  }
  .toolbar-inner {
    max-width: 720px; margin: 0 auto; padding: 0 1.5rem;
    display: flex; align-items: center; gap: 0.5rem;
  }
  .toolbar-brand {
    font-family: var(--serif); font-size: 1.25rem; font-weight: 700;
    color: var(--fg); letter-spacing: -0.02em; margin-right: auto;
    text-decoration: none;
  }
  .toolbar-brand em { font-style: italic; }
  .tool-btn {
    font-family: var(--sans); font-size: 0.7rem; font-weight: 600;
    letter-spacing: 0.1em; text-transform: uppercase;
    background: none; border: 1px solid var(--stone); color: var(--sage);
    padding: 0.3rem 0.7rem; border-radius: var(--radius-pill);
    cursor: pointer; transition: all 0.3s ease; line-height: 1.4;
  }
  .tool-btn:hover { border-color: var(--sage); color: var(--fg); }
  .tool-btn.active { background: var(--fg); color: var(--bg); border-color: var(--fg); }

  /* ===== HEADER (removed — brand is in toolbar now) ===== */

  /* ===== SECTION ===== */
  .section { padding: 2.5rem 0; }
  .section-header {
    display: flex; align-items: baseline; gap: 0.75rem;
    margin-bottom: 1.75rem; padding-bottom: 0.75rem;
    border-bottom: 1px solid var(--stone); transition: border-color 0.4s ease;
  }
  .section-icon { font-size: 1.3rem; flex-shrink: 0; }
  .section-title { font-family: var(--serif); font-size: 1.6rem; font-weight: 600; color: var(--fg); }
  .section-right {
    margin-left: auto; display: flex; align-items: baseline; gap: 0.75rem;
  }
  .section-count {
    font-family: var(--sans); font-size: 0.7rem; color: var(--sage);
    font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase;
  }
  .section-date {
    font-family: var(--serif); font-size: 0.75rem; color: var(--sage);
    font-style: italic; font-weight: 400; white-space: nowrap;
  }

  /* ===== HERO (curated main feed) ===== */
  .hero-section {
    padding: 1.25rem 0 2rem;
  }
  .hero-eyebrow {
    font-family: var(--sans); font-size: 0.65rem; font-weight: 600;
    letter-spacing: 0.18em; text-transform: uppercase; color: var(--terracotta);
    margin-bottom: 0.5rem;
  }
  .hero-meta {
    display: flex; align-items: center; gap: 0.75rem;
    font-family: var(--sans); font-size: 0.7rem; color: var(--sage);
    font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase;
    margin: 0.5rem 0 1.5rem; padding-bottom: 0.75rem;
    border-bottom: 1px solid var(--stone);
  }
  .other-cats-divider {
    text-align: center; font-family: var(--serif); font-style: italic;
    font-size: 0.8rem; color: var(--sage); letter-spacing: 0.15em;
    margin: 3rem 0 0.5rem; padding-top: 1.5rem;
    border-top: 1px solid var(--stone);
  }
  @media (max-width: 767px) {
    .hero-meta { font-size: 0.6rem; gap: 0.5rem; }
  }

  /* ===== BOTTOM NAV (plain tab bar, auto-hide while reading) ===== */
  .bottom-nav {
    position: fixed; left: 0; right: 0; bottom: 0;
    z-index: 90;
    display: flex; align-items: stretch;
    background: var(--card-bg);
    border-top: 1px solid var(--stone);
    transition: transform 0.35s cubic-bezier(.22,.61,.36,1);
    padding-bottom: env(safe-area-inset-bottom, 0);
  }
  .bottom-nav.hidden {
    transform: translateY(100%);
    pointer-events: none;
  }
  .nav-btn {
    flex: 1 1 0; min-width: 0;
    font-family: var(--sans); font-size: 0.72rem; font-weight: 500;
    color: var(--sage); background: none; border: none;
    padding: 0.65rem 0.4rem 0.7rem;
    cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.2rem;
    transition: color 0.2s ease, background 0.2s ease;
    border-top: 2px solid transparent;
  }
  .nav-btn:hover { color: var(--fg); }
  .nav-btn.active { color: var(--fg); border-top-color: var(--terracotta); }
  .nav-btn-icon { font-size: 1.05rem; line-height: 1; }
  .nav-btn-label {
    max-width: 100%; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; letter-spacing: 0.01em;
  }
  @media (max-width: 480px) {
    .nav-btn { font-size: 0.62rem; padding: 0.55rem 0.25rem 0.6rem; gap: 0.15rem; }
    .nav-btn-icon { font-size: 1rem; }
  }

  /* Bottom padding so cards don't hide behind the nav */
  body { padding-bottom: 4.5rem; }
  @media (max-width: 480px) { body { padding-bottom: 4rem; } }

  /* ===== CARDS ===== */
  .card-list { display: flex; flex-direction: column; gap: 1rem; }
  .card {
    background: var(--card-bg); border: 1px solid var(--stone);
    border-radius: var(--radius-card); padding: 1.5rem 1.75rem;
    transition: box-shadow 0.5s ease-out, background 0.4s ease, border-color 0.4s ease;
    position: relative; cursor: pointer;
  }
  .card:hover { box-shadow: var(--shadow-xl); }
  .card-title {
    font-family: var(--serif); font-size: 1.1rem; font-weight: 600;
    color: var(--fg); line-height: 1.4; transition: color 0.3s ease;
  }
  .card:hover .card-title { color: var(--terracotta); }
  .card-date {
    font-size: 0.75rem; color: var(--sage); font-weight: 400;
    margin-top: 0.3rem; font-style: italic; opacity: 0.7;
  }
  .card-preview {
    font-size: 0.88rem; color: var(--sage); margin-top: 0.5rem;
    line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden;
  }
  .card-meta {
    display: flex; align-items: center; gap: 0.4rem;
    margin-top: 0.75rem; flex-wrap: wrap;
  }
  .source-pill {
    display: inline-block; font-size: 0.6rem; font-weight: 600;
    padding: 0.15rem 0.5rem; border-radius: var(--radius-pill);
    text-transform: uppercase; letter-spacing: 0.08em; color: #fff; background: var(--fg);
  }
  .src-hacker_news { background: #D4764E; }
  .src-github_trending, .src-github_releases { background: #6B8F71; }
  .src-reddit_programming, .src-reddit_ml, .src-reddit_experienceddevs { background: #B85A4A; }
  .src-techcrunch { background: #5B8A6A; }
  .src-lobsters { background: #9E5B5B; }
  .src-tldr { background: #7B7FA3; }
  .src-vercel_blog { background: #555; }
  .src-huggingface_blog { background: #C2923C; }
  .src-devto { background: #6B7E73; }
  .tag-pill {
    display: inline-block; font-size: 0.6rem; font-weight: 500;
    padding: 0.1rem 0.45rem; border-radius: var(--radius-pill);
    border: 1px solid var(--stone); color: var(--sage); letter-spacing: 0.03em;
    transition: border-color 0.3s ease;
  }
  .score-badge {
    margin-left: auto; font-family: var(--serif); font-size: 0.8rem;
    font-weight: 600; color: var(--terracotta); white-space: nowrap;
  }

  /* ===== EXPANDED DETAIL ===== */
  .card-detail {
    max-height: 0; overflow: hidden; opacity: 0;
    transition: max-height 0.5s ease-out, opacity 0.4s ease-out, margin-top 0.4s ease-out;
    margin-top: 0;
  }
  .card.open .card-detail { max-height: 800px; opacity: 1; margin-top: 1.25rem; }
  .card.open .card-preview { display: none; }
  .card.open { background: var(--clay-light); }
  .detail-divider { border: none; border-top: 1px solid var(--stone); margin: 0 0 1rem; }
  .detail-text { font-size: 0.95rem; color: var(--fg); line-height: 1.8; font-weight: 400; }
  .detail-origin {
    display: inline-flex; align-items: center; gap: 0.35rem;
    margin-top: 1.25rem; font-size: 0.8rem; font-weight: 500;
    color: var(--sage); text-decoration: none;
    padding: 0.4rem 0.9rem; border: 1px solid var(--stone);
    border-radius: var(--radius-pill); transition: all 0.3s ease;
  }
  .detail-origin:hover { border-color: var(--terracotta); color: var(--terracotta); }
  .detail-arrow { display: inline-block; transition: transform 0.3s ease; font-size: 0.9rem; }
  .detail-origin:hover .detail-arrow { transform: translateX(3px); }

  /* ===== VINE ===== */
  .vine-separator { display: block; margin: 1.5rem auto; opacity: 0.3; color: var(--sage); }
  html.dark .vine-separator { opacity: 0.15; }

  /* ===== FAILED ===== */
  .failed-section {
    margin: 3rem 0; padding: 1.5rem 2rem; background: var(--clay-light);
    border-radius: var(--radius-card); border: 1px solid var(--stone);
    transition: background 0.4s ease, border-color 0.4s ease;
  }
  .failed-toggle {
    cursor: pointer; font-size: 0.85rem; color: var(--sage);
    font-weight: 500; letter-spacing: 0.05em; list-style: none;
  }
  .failed-toggle::-webkit-details-marker { display: none; }
  .failed-toggle::before {
    content: '\203A'; display: inline-block; margin-right: 0.5rem;
    transition: transform 0.3s ease; font-size: 1rem;
  }
  details[open] .failed-toggle::before { transform: rotate(90deg); }
  .failed-list { margin-top: 0.75rem; line-height: 2; }
  .failed-item {
    display: inline-block; padding: 0.15rem 0.6rem; margin: 0.15rem;
    background: var(--card-bg); border: 1px solid var(--stone);
    border-radius: var(--radius-pill); font-size: 0.7rem; color: var(--sage);
    transition: background 0.4s ease, border-color 0.4s ease;
  }

  /* ===== FOOTER ===== */
  .site-footer {
    text-align: center; padding: 4rem 0 3rem; color: var(--sage);
    font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase;
  }
  .site-footer::before {
    content: ''; display: block; width: 40px; height: 1px;
    background: var(--stone); margin: 0 auto 2rem; transition: background 0.4s ease;
  }

  @media (max-width: 767px) {
    .container { padding: 0 1rem; }
    .toolbar-inner { padding: 0 1rem; }
    .toolbar-brand { font-size: 1.05rem; }
    .tool-btn { font-size: 0.6rem; padding: 0.25rem 0.55rem; }
    .section { padding: 1.5rem 0; }
    .section-header { flex-wrap: wrap; gap: 0.4rem; }
    .section-title { font-size: 1.2rem; }
    .section-right { width: 100%; gap: 0.5rem; margin-left: 0; }
    .section-date { font-size: 0.65rem; }
    .section-count { font-size: 0.6rem; }
    .card { padding: 1.1rem 1.25rem; }
    .card-title { font-size: 0.95rem; }
    .card-preview { font-size: 0.82rem; }
    .card-meta { gap: 0.3rem; }
    .card.open .card-detail { max-height: 1200px; }
    .detail-text { font-size: 0.9rem; }
    .source-pill { font-size: 0.55rem; }
    .tag-pill { font-size: 0.55rem; }
    .score-badge { font-size: 0.7rem; }
  }
</style>
</head>

  'load balanc','message queue','pub/sub','stream',
  '백엔드','분산','마이크로서비스','데이터베이스','확장','인프라','아키텍처','지연','처리량',
  '캐시','큐','복제','샤딩','일관성','트랜잭션','관측','장애','신뢰성','파이프라인'
];

function backendScore(item) {
  if (typeof item.backend_score === 'number') return item.backend_score;
  var score = 0;
  var tags = (item.tags || []).map(function(t) { return String(t).toLowerCase(); });
  for (var i = 0; i < tags.length; i++) {
    if (BACKEND_TAGS[tags[i]]) score += BACKEND_TAGS[tags[i]];
    if (BACKEND_NEG_TAGS[tags[i]]) score += BACKEND_NEG_TAGS[tags[i]];
  }
  var text = ((item.title || '') + ' ' + (item.title_ko || '') + ' ' +
              (item.summary_ko || '') + ' ' + (item.detail_ko || '') + ' ' +
              (item.detail_en || '')).toLowerCase();
  for (var k = 0; k < BACKEND_KEYWORDS.length; k++) {
    if (text.indexOf(BACKEND_KEYWORDS[k]) !== -1) score += 2;
  }
  var src = item.source;
  if (src && BACKEND_SOURCE_BOOST.hasOwnProperty(src)) score += BACKEND_SOURCE_BOOST[src];
  if (item.category === 'ai_research') score -= 4;
  if (item.category === 'eng_blogs') score += 2;
  score += Math.min(5, Math.floor((item.final_score || 0) / 25));
  return score;
}

/* Engineering 메인 섹션 = eng_blogs 카테고리 아이템을 backend_score → score 순으로 정렬.
 * 백엔드 개발자에게 정말 도움되는 깊이를 우선. 프론트/인프라/언어 관련도 약간 섞여 OK. */
function pickEngineeringItems(items) {
  var picked = items.filter(function(it) { return it.category === 'eng_blogs'; });
  picked.sort(function(a, b) {
    var ba = backendScore(a), bb = backendScore(b);
    if (bb !== ba) return bb - ba;
    return (b.score || 0) - (a.score || 0);
  });
  return picked;
}

function el(tag, attrs, children) {
  var e = document.createElement(tag);
  if (attrs) {
    for (var k in attrs) {
      if (!attrs.hasOwnProperty(k)) continue;
      var v = attrs[k];
      if (k === 'className') e.className = v;
      else if (k === 'textContent') e.textContent = v;
      else e.setAttribute(k, v);
    }
  }
  if (children) {
    var list = Array.isArray(children) ? children : [children];
    for (var i = 0; i < list.length; i++) {
      var c = list[i];
      if (!c) continue;
      if (typeof c === 'string') e.appendChild(document.createTextNode(c));
      else e.appendChild(c);
    }
  }
  return e;
}

function createVineSvg() {
  var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('width', '120'); svg.setAttribute('height', '24');
  svg.setAttribute('viewBox', '0 0 120 24'); svg.setAttribute('fill', 'none');
  svg.setAttribute('class', 'vine-separator');
  var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  path.setAttribute('d', 'M0 12 Q20 2 40 12 Q60 22 80 12 Q100 2 120 12');
  path.setAttribute('stroke', 'currentColor'); path.setAttribute('stroke-width', '1');
  svg.appendChild(path); return svg;
}

function getTitle(item) { return currentLang === 'ko' ? item.title_ko : item.title; }
function getSummary(item) {
  if (currentLang === 'en') {
    var en = item.detail_en || '';
    if (en) {
      var first = en.split('\n')[0];
      return first.length > 150 ? first.substring(0, 147) + '...' : first;
    }
    return item.summary_ko;
  }
  return item.summary_ko;
}
function getDetail(item) {
  if (currentLang === 'en') return item.detail_en || item.detail_ko || item.summary_ko;
  return item.detail_ko || item.summary_ko;
}

function formatPubDate(dateStr) {
  if (!dateStr) return '';
  var d = new Date(dateStr);
  if (isNaN(d.getTime())) return dateStr;
  return I18N[currentLang].pubDate(d);
}

function createCard(item) {
  var t = I18N[currentLang];
  var card = el('div', { className: 'card fade-in', role: 'button', tabindex: '0', 'aria-expanded': 'false' });
  function toggleCard(e) {
    if (e.target.closest('.detail-origin')) return;
    if (e.type === 'keydown' && e.key !== 'Enter' && e.key !== ' ') return;
    if (e.type === 'keydown') e.preventDefault();
    var isOpen = card.classList.toggle('open');
    card.setAttribute('aria-expanded', String(isOpen));
    if (typeof onCardOpenStateChange === 'function') onCardOpenStateChange();
  }
  card.addEventListener('click', toggleCard);
  card.addEventListener('keydown', toggleCard);

  card.appendChild(el('div', { className: 'card-title', textContent: getTitle(item) }));

  var pubDate = formatPubDate(item.published_at);
  if (pubDate) card.appendChild(el('div', { className: 'card-date', textContent: pubDate }));

  card.appendChild(el('p', { className: 'card-preview', textContent: getSummary(item) }));

  var meta = el('div', { className: 'card-meta' });
  var srcClass = 'source-pill src-' + item.source.replace(/[^a-z_]/g, '');
  meta.appendChild(el('span', { className: srcClass, textContent: item.source }));
  (item.tags || []).slice(0, 3).forEach(function(tag) {
    meta.appendChild(el('span', { className: 'tag-pill', textContent: tag }));
  });
  meta.appendChild(el('span', { className: 'score-badge', textContent: '\u2736 ' + item.score }));
  card.appendChild(meta);

  var detail = el('div', { className: 'card-detail' });
  detail.appendChild(el('hr', { className: 'detail-divider' }));
  var detailContent = getDetail(item);
  var paragraphs = detailContent.split('\n').filter(function(p) { return p.trim().length > 0; });
  for (var pi = 0; pi < paragraphs.length; pi++) {
    var p = el('p', { className: 'detail-text', textContent: paragraphs[pi].trim() });
    if (pi < paragraphs.length - 1) p.style.marginBottom = '0.75rem';
    detail.appendChild(p);
  }
  var originLink = el('a', { className: 'detail-origin', href: item.url, target: '_blank', rel: 'noopener' });
  originLink.appendChild(document.createTextNode(t.viewOriginal));
  originLink.appendChild(el('span', { className: 'detail-arrow', textContent: ' \u2192' }));
  detail.appendChild(originLink);
  card.appendChild(detail);

  return card;
}

function render(data) {
  var t = I18N[currentLang];
  var items = data.items;
  var meta = data.meta || { sources_failed: [] };

  var dateObj = data.collected_at ? new Date(data.collected_at) : new Date(data.date);
  var dateStr = t.dateFmt(dateObj) + ' \u00B7 ' + t.timeFmt(dateObj) + ' ' + t.latest;

  var content = document.getElementById('content');
  content.textContent = '';

  // ===== Hero: Engineering (eng_blogs sorted by backend relevance) =====
  var engItems = pickEngineeringItems(items);
  if (engItems.length > 0) {
    var hero = el('section', { className: 'hero-section fade-in', id: 'section-engineering' });
    hero.appendChild(el('div', { className: 'hero-eyebrow', textContent: t.latest + ' \u00B7 ' + dateStr.split(' \u00B7 ')[0] }));

    var heroMeta = el('div', { className: 'hero-meta' });
    heroMeta.appendChild(el('span', { textContent: engItems.length + ' ' + t.items }));
    hero.appendChild(heroMeta);

    var heroList = el('div', { className: 'card-list' });
    for (var bi = 0; bi < engItems.length; bi++) heroList.appendChild(createCard(engItems[bi]));
    hero.appendChild(heroList);
    content.appendChild(hero);

    content.appendChild(el('div', { className: 'other-cats-divider', textContent: t.moreInOtherCategories }));
  }

  var categories = ['news_blogs', 'github_oss', 'community'];
  var rendered = 0;
  for (var c = 0; c < categories.length; c++) {
    var cat = categories[c];
    var catItems = items.filter(function(it) { return it.category === cat; });
    if (catItems.length === 0) continue;
    if (rendered > 0) content.appendChild(createVineSvg());
    var cfg = t.categories[cat];

    var section = el('div', { className: 'section fade-in', id: 'section-' + cat });
    var header = el('div', { className: 'section-header' });
    header.appendChild(el('span', { className: 'section-icon', textContent: cfg.icon }));
    header.appendChild(el('h2', { className: 'section-title', textContent: cfg.label }));
    var right = el('div', { className: 'section-right' });
    right.appendChild(el('span', { className: 'section-date', textContent: dateStr }));
    right.appendChild(el('span', { className: 'section-count', textContent: catItems.length + ' ' + t.items }));
    header.appendChild(right);
    section.appendChild(header);
    var list = el('div', { className: 'card-list' });
    for (var i = 0; i < catItems.length; i++) list.appendChild(createCard(catItems[i]));
    section.appendChild(list);
    content.appendChild(section);
    rendered++;
  }

  // Failed sources
  var failedSection = document.getElementById('failedSection');
  document.getElementById('failedToggleText').textContent = t.failedSources;
  if (meta.sources_failed.length > 0) {
    failedSection.style.display = 'block';
    var failedList = document.getElementById('failedList');
    failedList.textContent = '';
    for (var f = 0; f < meta.sources_failed.length; f++) {
      failedList.appendChild(el('span', { className: 'failed-item', textContent: meta.sources_failed[f] }));
    }
  }

  requestAnimationFrame(function() {
    if (currentObserver) currentObserver.disconnect();
    currentObserver = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) entry.target.classList.add('visible');
      });
    }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });
    document.querySelectorAll('.fade-in').forEach(function(e) { currentObserver.observe(e); });
  });

  buildBottomNav();
}

/* ===== BOTTOM NAV =====
 * Visibility = NOT(hiddenForReading || hiddenForScrollDir)
 *  - hiddenForReading: 카드 펼친 채로 일정 시간 idle 이면 true (몰입 상태로 가린다)
 *  - hiddenForScrollDir: 카드 안 열린 상태에서 아래로 스크롤할 때 true (목록 탐색 중 절약)
 * 사용자가 스크롤하면 두 플래그 모두 풀어 즉시 노출. 1.5s 후 다시 가린다.
 */
var bottomNavSections = [];
var lastScrollY = 0;
var hiddenForReading = false;
var hiddenForScrollDir = false;
var navClickGuardUntil = 0;
var readingHideTimer = null;
var READING_HIDE_DELAY = 1500;

function buildBottomNav() {
  var nav = document.getElementById('bottomNav');
  if (!nav) return;
  nav.textContent = '';

  var navLabels = currentLang === 'ko'
    ? { engineering: '엔지니어링', news_blogs: '뉴스', github_oss: 'GitHub', community: '커뮤니티' }
    : { engineering: 'Engineering', news_blogs: 'News', github_oss: 'GitHub', community: 'Community' };

  bottomNavSections = [];
  if (document.getElementById('section-engineering')) {
    bottomNavSections.push({ id: 'section-engineering', label: navLabels.engineering });
  }
  var orderedCats = ['news_blogs', 'github_oss', 'community'];
  for (var i = 0; i < orderedCats.length; i++) {
    var cat = orderedCats[i];
    if (!document.getElementById('section-' + cat)) continue;
    bottomNavSections.push({ id: 'section-' + cat, label: navLabels[cat] });
  }

  for (var s = 0; s < bottomNavSections.length; s++) {
    (function(sec) {
      var btn = el('button', { className: 'nav-btn', type: 'button', 'data-target': sec.id });
      btn.appendChild(el('span', { className: 'nav-btn-label', textContent: sec.label }));
      btn.addEventListener('click', function() {
        var target = document.getElementById(sec.id);
        if (!target) return;
        var y = target.getBoundingClientRect().top + window.scrollY - 16;
        navClickGuardUntil = Date.now() + 900;
        window.scrollTo({ top: y, behavior: 'smooth' });
      });
      nav.appendChild(btn);
    })(bottomNavSections[s]);
  }

  lastScrollY = window.scrollY;
  hiddenForReading = false;
  hiddenForScrollDir = false;
  updateBottomNavVisibility();
  updateBottomNavActive();
}

function anyCardOpen() {
  return !!document.querySelector('.card.open');
}

function updateBottomNavVisibility() {
  var nav = document.getElementById('bottomNav');
  if (!nav) return;
  nav.classList.toggle('hidden', hiddenForReading || hiddenForScrollDir);
}

function scheduleReadingHide() {
  clearTimeout(readingHideTimer);
  if (!anyCardOpen()) return;
  readingHideTimer = setTimeout(function() {
    if (anyCardOpen()) {
      hiddenForReading = true;
      updateBottomNavVisibility();
    }
  }, READING_HIDE_DELAY);
}

function onCardOpenStateChange() {
  if (anyCardOpen()) {
    scheduleReadingHide();
  } else {
    clearTimeout(readingHideTimer);
    hiddenForReading = false;
    updateBottomNavVisibility();
  }
}

function updateBottomNavActive() {
  var nav = document.getElementById('bottomNav');
  if (!nav || bottomNavSections.length === 0) return;
  var probe = window.scrollY + window.innerHeight * 0.35;
  var activeId = bottomNavSections[0].id;
  for (var i = 0; i < bottomNavSections.length; i++) {
    var node = document.getElementById(bottomNavSections[i].id);
    if (!node) continue;
    var top = node.getBoundingClientRect().top + window.scrollY;
    if (top <= probe) activeId = bottomNavSections[i].id;
  }
  var btns = nav.querySelectorAll('.nav-btn');
  for (var j = 0; j < btns.length; j++) {
    btns[j].classList.toggle('active', btns[j].getAttribute('data-target') === activeId);
  }
}

var navScrollTicking = false;
window.addEventListener('scroll', function() {
  if (navScrollTicking) return;
  navScrollTicking = true;
  requestAnimationFrame(function() {
    var y = window.scrollY;
    var dy = y - lastScrollY;
    // 스크롤이 발생하면 reading-hide는 즉시 해제 — 다시 사용 가능하게.
    hiddenForReading = false;

    // 카드를 펼친 채 읽는 중에는 방향 기반 자동 숨김 금지.
    // 평소(목록 탐색)에는: 상단 부근 노출 / 아래로 의미 있게 내리면 숨김 / 위로 올리면 노출.
    if (anyCardOpen() || Date.now() < navClickGuardUntil || y < 80) {
      hiddenForScrollDir = false;
    } else if (dy > 6) {
      hiddenForScrollDir = true;
    } else if (dy < -4) {
      hiddenForScrollDir = false;
    }

    lastScrollY = y;
    updateBottomNavVisibility();
    updateBottomNavActive();
    // 카드 펼친 채로 스크롤이 멈춘 뒤 다시 가린다.
    scheduleReadingHide();
    navScrollTicking = false;
  });
}, { passive: true });

/* ===== THEME ===== */
function applyTheme(theme) {
  currentTheme = theme;
  localStorage.setItem('ds-theme', theme);
  if (theme === 'dark') document.documentElement.classList.add('dark');
  else document.documentElement.classList.remove('dark');
  document.getElementById('btnTheme').textContent =
    theme === 'dark' ? I18N[currentLang].lightLabel : I18N[currentLang].darkLabel;
}

/* ===== LANG ===== */
function applyLang(lang) {
  currentLang = lang;
  localStorage.setItem('ds-lang', lang);
  document.documentElement.lang = lang;
  document.getElementById('btnKo').classList.toggle('active', lang === 'ko');
  document.getElementById('btnEn').classList.toggle('active', lang === 'en');
  document.getElementById('btnKo').setAttribute('aria-pressed', String(lang === 'ko'));
  document.getElementById('btnEn').setAttribute('aria-pressed', String(lang === 'en'));
  document.getElementById('btnTheme').textContent =
    currentTheme === 'dark' ? I18N[lang].lightLabel : I18N[lang].darkLabel;
  if (globalData) render(globalData);
}

/* ===== INIT ===== */
document.getElementById('btnKo').addEventListener('click', function() { applyLang('ko'); });
document.getElementById('btnEn').addEventListener('click', function() { applyLang('en'); });
document.getElementById('btnTheme').addEventListener('click', function() {
  applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
});

applyTheme(currentTheme);
applyLang(currentLang);

var currentObserver = null;

(async function() {
  var now = new Date();
  var y = now.getFullYear();
  var m = String(now.getMonth() + 1).padStart(2, '0');
  var d = String(now.getDate()).padStart(2, '0');
  var loaded = false;

  // Try: 1) today's raw.json, 2) latest.json manifest, 3) processed_data.json fallback
  var paths = ['data/' + y + '/' + m + '/' + d + '/raw.json', 'data/latest.json', 'processed_data.json'];
  for (var pi = 0; pi < paths.length; pi++) {
    try {
      var res = await fetch(paths[pi]);
      if (!res.ok) continue;
      var json = await res.json();
      if (json.path && !json.items) {
        res = await fetch(json.path);
        if (!res.ok) continue;
        json = await res.json();
      }
      if (json.items) { globalData = json; loaded = true; break; }
    } catch(e) { continue; }
  }

  if (loaded) { render(globalData); }
})();
</script>
